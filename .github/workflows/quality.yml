name: Quality

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Set shared command deadline
        run: echo "ARCO_CI_DEADLINE=$(($(date +%s) + 180))" >> "$GITHUB_ENV"

      - name: Check out source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        timeout-minutes: 1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Test contribution gate
        run: bash scripts/ci-run.sh node --test .github/tests/contribution-gate.check.cjs

      - name: Install locked dependencies
        run: bash scripts/ci-run.sh npm ci

      - name: Check source and build artifacts
        run: bash scripts/ci-run.sh npm run check

      - name: Install Chromium system dependencies
        run: sudo --preserve-env=ARCO_CI_DEADLINE bash scripts/ci-run.sh "$(command -v node)" node_modules/playwright/cli.js install-deps chromium

      - name: Install Chromium headless shell
        run: bash scripts/ci-run.sh npx --no-install playwright install --only-shell chromium

      - name: Test critical browser interactions
        id: smoke
        run: bash scripts/ci-run.sh npm run test:browser:smoke -- --reporter=list

      - name: Retain browser failure evidence
        if: failure() && steps.smoke.outcome == 'failure'
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
